name: Build OS

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm genisoimage grub-pc-bin grub-common mtools qemu-system-x86

      - name: Verificar arquivo stage2_eltorito
        working-directory: ./hellocafebabe
        run: test -f stage2_eltorito || (echo "stage2_eltorito não encontrado!" && exit 1)

      - name: Compilar o Sistema Operacional
        working-directory: ./hellocafebabe
        run: make -f Makefile.ci os.iso

      - name: Salvar a ISO como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: sistema-operacional-iso
          path: ./hellocafebabe/os.iso
          if-no-files-found: error
