name: Build OS

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm genisoimage grub-pc-bin grub-common mtools

      - name: Compilar o Sistema Operacional
        working-directory: ./hellocafebabe
        run: ./build.sh

      - name: Salvar a ISO como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: sistema-operacional-iso
          path: ./hellocafebabe/os.iso
