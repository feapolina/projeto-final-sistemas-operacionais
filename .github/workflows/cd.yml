name: Deploy Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      iso_path: ${{ steps.build.outputs.iso_path }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm genisoimage grub-pc-bin grub-common mtools qemu-system-x86

      - name: Compilar o Sistema Operacional
        id: build
        working-directory: ./hellocafebabe
        run: |
          make -f Makefile.ci os.iso
          echo "iso_path=$(pwd)/os.iso" >> $GITHUB_OUTPUT

      - name: Subir ISO como artefato temporário
        uses: actions/upload-artifact@v4
        with:
          name: os-iso-${{ github.ref_name }}
          path: ./hellocafebabe/os.iso
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Baixar ISO
        uses: actions/download-artifact@v4
        with:
          name: os-iso-${{ github.ref_name }}
          path: ./hellocafebabe

      - name: Testar ISO com QEMU (timeout 10s)
        working-directory: ./hellocafebabe
        run: |
          timeout 10s qemu-system-i386 -cdrom os.iso -display none -serial stdio || true

  release:
    needs: [build, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Baixar ISO
        uses: actions/download-artifact@v4
        with:
          name: os-iso-${{ github.ref_name }}
          path: ./dist

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --draft=false \
            ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') && '--prerelease' || '' }} \
            ./dist/os.iso

      - name: Upload ISO como asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} ./dist/os.iso --clobber
